<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Auralink · Passenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="dot" id="dot" title="Connection"></span>
    <h1 id="title">How can we help?</h1>
    <span class="muted" id="seat"></span>
    <select id="lang" aria-label="Language"></select>
    <label class="row muted"><input type="checkbox" id="senior"> <span id="seniorLabel">Large mode</span></label>
    <label class="row muted"><input type="checkbox" id="pictures"> <span id="picturesLabel">Pictures only</span></label>
    <label class="row muted" id="readWrap" hidden><input type="checkbox" id="read"> <span id="readLabel">Read aloud</span></label>
  </header>
  <main>
    <div class="panel voice-panel">
      <h2 id="typeHint">Type or say what you need</h2>
      <button type="button" class="mic" id="mic"><span class="icon" id="micIcon"></span> <span id="micLabel">Tap to speak</span></button>
      <p class="muted" id="micNote" hidden></p>
      <form class="row" id="form">
        <input class="grow" id="text" autocomplete="off" placeholder="thoda wotter and kambal">
        <button class="primary" id="send" type="submit">Send</button>
      </form>
    </div>
    <div class="panel">
      <h2 id="orTap">Or tap a picture</h2>
      <div class="grid" id="grid"></div>
    </div>
    <div class="panel">
      <h2 id="requestsLabel">Your requests</h2>
      <div class="list" id="requests"></div>
    </div>
  </main>
  <div id="overlay"></div>
  <div id="pa" aria-live="assertive"></div>

<script type="module">
import { Recorder, connect, el, loadConfig } from "./common.js";
import { pictogram } from "./pictograms.js";
import { icon } from "./icons.js";
import { canSpeak, speak } from "./speech.js";

// Screen text comes from data/i18n/<code>.json via the hub; missing keys fall back to English.
let STRINGS = {}, FALLBACK = {};
async function loadStrings(code) {
  const get = (c) => fetch(`/api/i18n/${c}`).then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
  [FALLBACK, STRINGS] = await Promise.all([get("en"), get(code)]);
}

const params = new URLSearchParams(location.search);
const seat = params.get("seat") || "34K";
const $ = (id) => document.getElementById(id);
let lang = params.get("lang") || "en";
let senior = params.get("senior") === "1";
// picture-only mode: for passengers who are deaf or have a speech difficulty (also via ?mode=pictures on the seat QR)
let pictures = params.get("mode") === "pictures";
// read aloud: the phone's own offline voice reads the fixed, pre-approved sentences (never in picture-only mode)
let readAloud = params.get("read") === "1";
let voiceOK = false;
let config;
const requests = new Map();  // card id -> {intent, label, message, state, urgent}

const t = (k) => STRINGS[k] ?? FALLBACK[k] ?? k;
// Messages can arrive before the language file has loaded (e.g. a phone reconnecting just as a
// request lands); hold them until the screen text is ready, then handle them in order.
let markReady;
const ready = new Promise((resolve) => (markReady = resolve));
const socket = connect(`/ws/passenger/${seat}`, (msg) => ready.then(() => onMessage(msg)), (on) => {
  $("dot").classList.toggle("on", on);
  // wait for check-in preferences, or this hello would overwrite them with defaults
  if (on) ready.then(() => socket.send({ type: "hello", lang, senior, pictures, read: readAloud }));
});

function say(lines) { if (readAloud && voiceOK && !pictures) speak(lines, lang); }
function listenBtn(lines) {
  if (!voiceOK || pictures) return null;
  return el("button", { class: "listen", "aria-label": t("listen"), title: t("listen"), onclick: () => speak(lines, lang) }, icon("speaker"));
}

// every update is also shown and felt, never only heard: a screen flash plus vibration
function attention() {
  document.body.classList.remove("flash");
  void document.body.offsetWidth;  // restart the animation
  document.body.classList.add("flash");
  if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
}

function applyStrings() {
  document.documentElement.lang = lang;
  for (const id of ["title", "typeHint", "send", "orTap", "requestsLabel", "seniorLabel", "picturesLabel", "readLabel"]) $(id).textContent = t(id);
  $("readWrap").hidden = !voiceOK || pictures;
  if (pictures) $("orTap").textContent = t("tapNeed");
  document.body.classList.toggle("pictures", pictures);
  setMic(micState);
  $("seat").textContent = `${t("seat")} ${seat}`;
  document.body.classList.toggle("big", senior);
  renderGrid($("grid"), (intent) => socket.send({ type: "icon", intent }));
}

function renderGrid(container, onPick, ids) {
  container.replaceChildren(...config.intents
    .filter((i) => !ids || ids.includes(i.id))
    .map((i) => el("button", { class: "tile", onclick: () => onPick(i.id) },
      icon(i.id), i.label[lang] || i.label.en)));
}

function sheet(...children) {
  closeCaption();   // a briefing, question or symptom sheet must never sit under an old PA caption
  const o = el("div", { class: "overlay" }, el("div", { class: `sheet ${senior ? "big" : ""}` }, ...children));
  $("overlay").replaceChildren(o);
}
const closeSheet = () => $("overlay").replaceChildren();

// One card at a time; split utterances queue the rest.
let pending = [];
let waitingTriage = null;   // a symptom question that arrived while other confirmations were open
function showNextConfirm() {
  const card = pending.shift();
  if (!card) {
    if (waitingTriage) { const t = waitingTriage; waitingTriage = null; return showTriage(t); }
    return closeSheet();
  }
  if (card.confident) {
    const o = card.options[0];
    say([t("confirmQ"), o.label]);
    sheet(el("div", { class: "row" }, el("h2", { class: "grow" }, t("confirmQ")), listenBtn([t("confirmQ"), o.label])),
      el("div", { class: "tile" }, icon(o.intent), o.label),
      el("div", { class: "row" },
        el("button", { class: "primary grow", onclick: () => { socket.send({ type: "confirm", card_id: card.id, intent: o.intent }); showNextConfirm(); } }, t("yes")),
        el("button", { class: "grow", onclick: () => socket.send({ type: "reject", card_id: card.id }) }, t("no"))));
  } else {
    const labels = card.options.slice(0, 2).map((o) => o.label);
    say([t("pickOne"), ...labels]);
    sheet(el("div", { class: "row" }, el("h2", { class: "grow" }, t("pickOne")), listenBtn([t("pickOne"), ...labels])),
      el("div", { class: "grid" }, card.options.slice(0, 2).map((o) => el("button", { class: "tile", onclick: () => {
        socket.send({ type: "confirm", card_id: card.id, intent: o.intent }); showNextConfirm(); } },
        icon(o.intent), o.label))),
      el("button", { onclick: () => socket.send({ type: "reject", card_id: card.id }) }, t("none")));
  }
}

function showGrid(cardId) {
  const grid = el("div", { class: "grid" });
  renderGrid(grid, (intent) => {
    socket.send(cardId ? { type: "icon", card_id: cardId, intent } : { type: "icon", intent });
    showNextConfirm();
  });
  say(t("together"));
  sheet(el("h2", {}, t("together")), grid);
}

function renderRequests() {
  $("requests").replaceChildren(...[...requests.values()].reverse().map((r) =>
    el("div", { class: `item ${r.urgent ? "is-urgent" : ""}` },
      icon(r.intent), el("strong", {}, r.label),
      el("span", { class: "state", title: t(r.state) }, icon({ sent: "check", seen: "eye", replied: "reply" }[r.state] || "check", t(r.state))),
      el("span", { class: "muted grow" }, r.message), listenBtn([r.label, r.message]))));
}

// microphone: idle -> recording -> thinking -> idle
let micState = "idle";
let recorder = null;
function setMic(state) {
  micState = state;
  $("mic").classList.toggle("recording", state === "recording");
  $("mic").disabled = state === "thinking" || state === "off";
  $("micLabel").textContent = t({ idle: "speak", recording: "stop", thinking: "thinking", off: "speak" }[state]);
}
function micNote(key) { $("micNote").textContent = t(key); $("micNote").hidden = false; }

async function toggleMic() {
  if (micState === "idle") {
    recorder = new Recorder();
    try {
      await recorder.start(8, () => micState === "recording" && toggleMic());
      setMic("recording");
    } catch {
      micNote("micDenied");
    }
  } else if (micState === "recording") {
    setMic("thinking");
    socket.sendBinary(await recorder.stop());
  }
}

function onMessage(msg) {
  if (["confirm", "grid", "status", "error"].includes(msg.type) && micState === "thinking") setMic("idle");
  if (msg.type === "thinking") setMic("thinking");
  else if (msg.type === "confirm") { pending = msg.cards; showNextConfirm(); }
  else if (msg.type === "grid") showGrid(msg.card_id);
  else if (msg.type === "status") {
    const c = msg.card;
    const shown = c.intent || c.options[0] || { intent: "call_crew", label: "" };
    const state = c.status === "acknowledged" ? "seen" : "sent";
    requests.set(c.id, { intent: shown.intent, label: shown.label, message: msg.message, urgent: c.urgent, state });
    if (c.status === "needs_human") closeSheet();
    if (state === "seen" || c.status === "needs_human") { attention(); say(msg.message); }
    renderRequests();
  } else if (msg.type === "reply") {
    const r = requests.get(msg.card_id);
    if (r) { r.message = msg.text; r.state = "replied"; renderRequests(); attention(); say(msg.text); }
  } else if (msg.type === "notice") {
    $("title").textContent = msg.message;
    setTimeout(() => ($("title").textContent = t("title")), 6000);
  } else if (msg.type === "pa") {
    showCaption(msg.caption);
  } else if (msg.type === "safety") {
    attention();
    showBriefing(msg.template);
  } else if (msg.type === "exit_check") {
    attention();
    showExitCheck(msg.check);
  } else if (msg.type === "triage") {
    if (pending.length) waitingTriage = msg; else showTriage(msg);
  } else if (msg.type === "triage_done") {
    say(msg.message);
    sheet(el("h2", {}, msg.message), el("button", { class: "primary", onclick: closeSheet }, t("ok")));
  } else if (msg.type === "reset") {   // presenter reset between demo runs
    pending = []; requests.clear(); renderRequests(); closeSheet();
  } else if (msg.type === "exit_done") {
    say(msg.message);
    sheet(el("h2", {}, t("thanks")), el("p", {}, msg.message),
      el("button", { class: "primary", onclick: closeSheet }, t("ok")));
  }
}

// --- live PA caption: what the crew just announced, in this passenger's language ------------------
let captionTimer = 0;
function closeCaption() { clearTimeout(captionTimer); $("pa").replaceChildren(); }
function showCaption(c) {
  attention();   // flash + vibration: the passenger may not hear the announcement at all
  say(c.text);
  const close = closeCaption;
  $("pa").replaceChildren(el("div", { class: "pa-banner", role: "alert" },
    icon(c.icon),
    el("div", {}, el("div", { class: "pa-tag" }, t("announcement")), el("p", { class: "pa-text" }, c.text),
      lang !== "en" ? el("p", { class: "pa-en", lang: "en" }, c.text_en) : null),
    el("div", { class: "pa-acts" }, listenBtn(c.text), el("button", { class: "primary", onclick: close }, t("ok")))));
  clearTimeout(captionTimer);
  captionTimer = setTimeout(close, 90_000);
}

// --- medical: what is wrong? Six big pictures, so crew know before they reach the seat ------------
function showTriage(msg) {
  attention();
  say(msg.triage.title);
  sheet(el("div", { class: "row" }, el("h2", { class: "grow urgent-title" }, msg.triage.title), listenBtn(msg.triage.title)),
    el("div", { class: "grid triage" }, msg.triage.symptoms.map((x) =>
      el("button", { class: "tile", onclick: () => socket.send({ type: "symptom", card_id: msg.card_id, symptom: x.id }) },
        icon(x.icon), x.label))));
}

// --- safety briefing: all steps, then "Explain again" goes one simple step at a time -------------
const picto = (id) => { const d = el("div", { class: "picto-box" }); d.innerHTML = pictogram(id); return d; };
const counter = (word, i, n) => `${word} ${i} ${t("of")} ${n}`;

function showBriefing(b) {
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  const steps = b.steps.map((st) => el("div", { class: "safety-step" }, picto(st.pictogram),
    el("div", { class: "grow" }, el("p", { class: "safety-text" }, st.text),
      lang !== "en" ? el("p", { class: "muted" }, st.text_en) : null), listenBtn(st.text)));
  say([b.title, ...b.steps.map((st) => st.text)]);
  sheet(el("div", { class: "row" }, el("h2", { class: "safety-title grow" }, b.title), listenBtn([b.title, ...b.steps.map((st) => st.text)])), ...steps,
    el("div", { class: "row" },
      el("button", { class: "primary grow", onclick: () => { socket.send({ type: "safety", status: "understood" }); closeSheet(); } }, t("understood")),
      el("button", { class: "grow", onclick: () => { socket.send({ type: "safety", status: "reexplaining" }); simpleStep(b, 0); } }, t("explain"))));
}

function simpleStep(b, i) {
  if (i >= b.steps.length) {
    socket.send({ type: "safety", status: "understood_again" });
    sheet(el("h2", {}, t("thanks")), el("button", { class: "primary", onclick: closeSheet }, t("ok")));
    return;
  }
  const st = b.steps[i];
  say(st.simple);
  sheet(el("p", { class: "muted" }, i === 0 ? t("reexplain") : counter(t("step"), i + 1, b.steps.length)),
    i === 0 ? el("p", { class: "muted" }, counter(t("step"), 1, b.steps.length)) : null,
    el("div", { class: "picto-big" }, picto(st.pictogram)),
    el("p", { class: "safety-simple" }, st.simple, listenBtn(st.simple)),
    el("div", { class: "row" },
      el("button", { class: "primary grow", onclick: () => simpleStep(b, i + 1) }, t("gotIt")),
      el("button", { class: "grow", onclick: () => {
        socket.send({ type: "safety", status: "stuck", step: i });
        say(t("crewComing"));
        sheet(el("h2", {}, st.simple), el("p", {}, t("crewComing")),
          el("button", { class: "primary", onclick: closeSheet }, t("ok")));
      } }, t("stillUnclear"))));
}

// --- exit-row check at boarding: three picture questions --------------------------------------------
function showExitCheck(c) {
  const answers = {};
  const ask = (i) => {
    if (i >= c.questions.length) return socket.send({ type: "exit_answer", answers });
    const q = c.questions[i];
    say(i === 0 ? [c.title, c.intro, q.text] : q.text);
    sheet(el("h2", { class: "safety-title" }, c.title), i === 0 ? el("p", {}, c.intro) : null,
      el("p", { class: "muted" }, counter(t("question"), i + 1, c.questions.length)),
      el("div", { class: "picto-big" }, picto(q.pictogram)),
      el("p", { class: "safety-simple" }, q.text, listenBtn(q.text)),
      el("div", { class: "row" },
        el("button", { class: "primary grow", onclick: () => { answers[q.id] = true; ask(i + 1); } }, c.answers.yes),
        el("button", { class: "grow", onclick: () => { answers[q.id] = false; ask(i + 1); } }, c.answers.no)),
      el("button", { class: "link", onclick: () => socket.send({ type: "exit_answer", answers, reseat: true }) }, c.answers.reseat));
  };
  ask(0);
}

$("mic").addEventListener("click", toggleMic);
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  socket.send({ type: "text", text });
  $("text").value = "";
});
$("read").addEventListener("change", (e) => {
  readAloud = e.target.checked;
  if (readAloud) speak(t("readLabel"), lang);
  socket.send({ type: "hello", lang, senior, pictures, read: readAloud });
});
async function setLanguage(code) {
  lang = code;
  try { localStorage.setItem(`auralink-lang-${seat}`, code); } catch { /* private mode: ask again next time */ }
  await loadStrings(lang);
  voiceOK = await canSpeak(lang);
  $("lang").value = lang;
  applyStrings();
  socket.send({ type: "hello", lang, senior, pictures, read: readAloud });
}
$("lang").addEventListener("change", (e) => setLanguage(e.target.value));

// First visit to this seat: one big, clear choice. Every language is shown in its own script AND in English.
const langLabel = (l) => (l.english && l.english !== l.name ? `${l.name} · ${l.english}` : l.name);
function chooseLanguage() {
  sheet(el("h2", { class: "choose-title" }, "Choose your language"),
    el("p", { class: "muted choose-sub" }, "अपनी भाषा चुनें · உங்கள் மொழியைத் தேர்ந்தெடுக்கவும் · เลือกภาษาของคุณ"),
    el("div", { class: "choose-langs" }, ...config.languages.map((l) =>
      el("button", { class: "choose-lang", lang: l.code, onclick: async () => { closeSheet(); await setLanguage(l.code); } },
        el("b", {}, l.name), l.english !== l.name ? el("small", { lang: "en" }, l.english) : null))),
    el("p", { class: "muted choose-sub" }, `Seat ${seat} · You can change it any time at the top of the screen.`));
}
$("pictures").addEventListener("change", (e) => { pictures = e.target.checked; applyStrings(); socket.send({ type: "hello", lang, senior, pictures, read: readAloud }); });
$("senior").addEventListener("change", (e) => { senior = e.target.checked; applyStrings(); socket.send({ type: "hello", lang, senior, pictures, read: readAloud }); });

config = await loadConfig();
// A plain seat QR (no settings in the link) opens with what was chosen at check-in.
let checkedIn = false;
if (!["lang", "senior", "mode", "read"].some((k) => params.has(k))) {
  try {
    const p = await (await fetch(`/api/seat/${seat}`)).json();
    if (p.checked_in) {
      checkedIn = true;
      ({ lang, senior, pictures, read: readAloud } = { lang: p.lang, senior: p.senior, pictures: p.pictures, read: p.read });
    }
  } catch { /* hub unreachable: keep the defaults */ }
}
// Not set at check-in or in the link: use what this phone chose before, or ask.
let askLanguage = false;
if (!params.has("lang") && !checkedIn) {
  let saved = null;
  try { saved = localStorage.getItem(`auralink-lang-${seat}`); } catch { /* storage blocked */ }
  if (config.languages.some((l) => l.code === saved)) lang = saved; else askLanguage = true;
}
$("lang").replaceChildren(...config.languages.map((l) => el("option", { value: l.code }, langLabel(l))));
if (!config.languages.some((l) => l.code === lang)) lang = "en";
await loadStrings(lang);
voiceOK = await canSpeak(lang);
$("read").checked = readAloud;
if (!Recorder.supported()) { micState = "off"; micNote("micOff"); }
$("lang").value = lang;
$("senior").checked = senior;
$("pictures").checked = pictures;
$("micIcon").replaceWith(icon("mic"));
applyStrings();
markReady();
if (askLanguage) chooseLanguage();
</script>
</body>
</html>
