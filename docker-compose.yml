services:
  hub:
    build: .
    expose:
      - "8000"
    environment:
      - AURALINK_CREW_PIN=${AURALINK_CREW_PIN:?set a 6-digit crew PIN in .env}
      - AURALINK_PUBLIC_URL=${AURALINK_PUBLIC_URL:?set https://<your-domain-or-ip>.nip.io in .env}
    volumes:
      - auralink-data:/app/data
      - hf-cache:/root/.cache/huggingface
      - fastembed-cache:/root/.cache/fastembed
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hub
    restart: unless-stopped

volumes:
  auralink-data:
  hf-cache:
  fastembed-cache:
  caddy-data:
  caddy-config:
