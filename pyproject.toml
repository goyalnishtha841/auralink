[project]
name = "auralink"
version = "0.1.0"
description = "Offline multilingual cabin-request assistant: passenger voice/icons -> phonetic intent matching -> crew tablet."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["eval/cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
